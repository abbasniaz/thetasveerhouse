<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Thetas Veer House</title>

  <!-- Simple styling for layout and the LightWidget embed -->
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      line-height: 1.4;
      margin: 0;
      padding: 0;
      background: #fff;
      color: #222;
    }
    header { padding: 24px; text-align: center; border-bottom: 1px solid #eee; }
    main { max-width: 1100px; margin: 28px auto; padding: 0 16px; }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p.lead { margin: 0 0 24px; color: #555; }

    /* LightWidget wrapper & iframe styling */
    .lw-embed-wrap { max-width: 1100px; margin: 0 auto; }
    .lw-embed-wrap iframe.lightwidget-widget {
      width: 100%;
      border: 0;
      overflow: hidden;
      display: block;
      /* default height; adjust as needed */
      height: 640px;
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      .lw-embed-wrap iframe.lightwidget-widget { height: 560px; }
    }
    @media (max-width: 600px) {
      .lw-embed-wrap iframe.lightwidget-widget { height: 420px; }
    }

    footer { text-align:center; padding: 24px; color:#888; border-top:1px solid #eee; margin-top: 36px; }
  </style>
</head>
